name: CPU tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy pillow opencv-python safetensors
      - name: Check Python syntax
        run: python -m compileall -q mtdiff scripts tests train.py translate_page.py
      - name: Test
        run: python -m pytest tests -q
