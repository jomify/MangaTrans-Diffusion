<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">MangaTrans-Diffusion architecture</title>
  <desc id="desc">Architecture diagram of MangaTrans-Diffusion. A source page is encoded by a frozen VAE, Chinese text is rendered into 64 glyph channels, and source latent plus noise is sampled through a sixteen-layer DiT with time conditioning. Overlapping latent tiles average velocity predictions. The VAE decodes the result and a soft mask composites requested regions with the source page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c13c26"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#171615"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#171615" opacity=".16"/>
    </pattern>
    <style>
      .ink{fill:#171615}.muted{fill:#6f675d}.red{fill:#c13c26}.paper{fill:#f4ecdf}.panel{fill:#fffaf1;stroke:#171615;stroke-width:2}.soft{fill:#e7dac8;stroke:#171615;stroke-width:1.5}.line{fill:none;stroke:#171615;stroke-width:2}.flow{fill:none;stroke:#c13c26;stroke-width:3;marker-end:url(#arrow)}.flow-ink{fill:none;stroke:#171615;stroke-width:2;marker-end:url(#arrow-ink)}.dash{fill:none;stroke:#6f675d;stroke-width:1.5;stroke-dasharray:7 6}.dash-flow{fill:none;stroke:#6f675d;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow-ink)}.label{font:700 15px Inter,Arial,sans-serif;letter-spacing:.12em}.small{font:15px Inter,Arial,sans-serif}.body{font:18px Inter,Arial,sans-serif}.title{font:500 46px Georgia,'Times New Roman',serif;letter-spacing:-.04em}.mono{font:16px 'IBM Plex Mono','Courier New',monospace}.tiny{font:13px Inter,Arial,sans-serif}.center{text-anchor:middle}.right{text-anchor:end}
    </style>
  </defs>

  <rect width="1600" height="930" class="paper"/>
  <rect x="34" y="30" width="1532" height="870" rx="8" fill="none" stroke="#171615" stroke-opacity=".25"/>

  <text x="76" y="92" class="label red">MANGATRANS-DIFFUSION / ARCHITECTURE</text>
  <text x="76" y="148" class="title ink">Source-conditioned lettering in latent space</text>
  <text x="76" y="185" class="body muted">The released v3 path, rendered from the model configuration and inference code.</text>
  <text x="1525" y="92" class="label red right">119.3M PARAMETERS</text>
  <text x="1525" y="122" class="small muted right">16 layers · width 768 · 12 heads</text>

  <!-- Inputs -->
  <rect x="76" y="245" width="264" height="240" rx="6" class="panel"/>
  <text x="100" y="280" class="label red">01 / SOURCE PAGE</text>
  <rect x="103" y="302" width="210" height="137" fill="#d9d0c4" stroke="#171615" stroke-width="2"/>
  <path d="M121 405 C145 357 179 350 205 378 C230 342 274 352 298 402" fill="none" stroke="#171615" stroke-width="7"/>
  <ellipse cx="178" cy="336" rx="43" ry="25" fill="#fffaf1" stroke="#171615" stroke-width="3" transform="rotate(-8 178 336)"/>
  <path d="M159 357 L145 378" class="line"/>
  <text x="178" y="341" class="mono center ink">おはよう</text>
  <text x="103" y="458" class="small muted">RGB page · H × W × 3</text>
  <text x="103" y="479" class="tiny muted">demo: おはよう → 早上好</text>

  <rect x="76" y="525" width="264" height="240" rx="6" class="panel"/>
  <text x="100" y="560" class="label red">02 / TEXT CONDITION</text>
  <rect x="103" y="584" width="210" height="112" fill="#171615"/>
  <text x="208" y="653" class="mono center" fill="#fffaf1">早上好</text>
  <rect x="126" y="603" width="164" height="72" fill="none" stroke="#c13c26" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="103" y="730" class="small muted">supplied Chinese text</text>
  <text x="103" y="752" class="small muted">layout box in page pixels</text>

  <!-- Encoders -->
  <rect x="395" y="273" width="232" height="164" rx="6" class="soft"/>
  <text x="511" y="309" class="label center red">FROZEN VAE</text>
  <text x="511" y="347" class="body center ink">encode</text>
  <text x="511" y="381" class="mono center ink">16 latent channels</text>
  <text x="511" y="410" class="small center muted">spatial stride 8</text>
  <path d="M340 365 H395" class="flow"/>

  <rect x="395" y="548" width="232" height="164" rx="6" class="soft"/>
  <text x="511" y="584" class="label center red">GLYPH RENDERER</text>
  <text x="511" y="622" class="body center ink">plain font → glyph pixels</text>
  <text x="511" y="656" class="mono center ink">pixel-unshuffle(8)</text>
  <text x="511" y="686" class="small center muted">64 channels at latent size</text>
  <path d="M340 645 H395" class="flow"/>

  <!-- Start latent -->
  <rect x="692" y="287" width="246" height="137" rx="6" class="panel"/>
  <text x="815" y="322" class="label center red">START POINT</text>
  <text x="815" y="360" class="mono center ink">x₁ = source + 0.5 · ε</text>
  <text x="815" y="393" class="small center muted">source latent anchors the edit</text>
  <path d="M627 355 H692" class="flow"/>

  <!-- DiT -->
  <rect x="692" y="487" width="246" height="260" rx="6" fill="#171615"/>
  <text x="815" y="524" class="label center" fill="#f4ecdf">DiT VELOCITY FIELD</text>
  <text x="815" y="550" class="mono center" fill="#f4ecdf">noisy 16 + source 16</text>
  <text x="815" y="574" class="tiny center" fill="#c9bdb0">glyph 64 → 96 input channels</text>
  <text x="815" y="596" class="tiny center" fill="#c9bdb0">timestep t → velocity 16</text>
  <rect x="723" y="620" width="184" height="95" fill="#282321" stroke="#c13c26" stroke-width="2"/>
  <text x="815" y="643" class="tiny center" fill="#ff987f">× 16 BLOCKS</text>
  <text x="815" y="665" class="tiny center" fill="#f4ecdf">adaLN time modulation</text>
  <text x="815" y="686" class="tiny center" fill="#f4ecdf">QK-norm · 2D RoPE · 12 heads</text>
  <text x="815" y="707" class="tiny center" fill="#c9bdb0">2×2 latent patches</text>
  <path d="M815 424 V487" class="flow"/>
  <path d="M627 630 H692" class="flow"/>
  <path d="M627 400 C650 400 650 535 692 535" class="flow-ink"/>
  <text x="676" y="475" class="tiny muted right">source latent 16</text>

  <!-- timestep branch -->
  <rect x="1004" y="287" width="176" height="137" rx="6" class="panel"/>
  <text x="1092" y="322" class="label center red">TIME</text>
  <text x="1092" y="360" class="mono center ink">t : 1 → 0</text>
  <text x="1092" y="393" class="small center muted">sinusoidal embedding</text>
  <path d="M1004 355 C962 355 960 536 938 536" class="flow"/>

  <!-- tiling and sampler -->
  <rect x="1004" y="487" width="224" height="283" rx="6" class="soft"/>
  <text x="1116" y="524" class="label center red">TILED SAMPLER</text>
  <rect x="1032" y="552" width="168" height="102" fill="url(#dots)" stroke="#171615" stroke-width="2"/>
  <rect x="1032" y="552" width="102" height="72" fill="none" stroke="#c13c26" stroke-width="3"/>
  <rect x="1098" y="582" width="102" height="72" fill="none" stroke="#c13c26" stroke-width="3"/>
  <text x="1116" y="680" class="mono center ink">64 × 64 latent tiles</text>
  <text x="1116" y="705" class="small center muted">stride 48 · overlap average</text>
  <text x="1116" y="730" class="small center muted">Euler: x ← x + Δt · v</text>
  <text x="1116" y="752" class="tiny center muted">repeat over t 1 → 0</text>
  <path d="M938 617 H1004" class="flow"/>

  <!-- decode / compositor -->
  <rect x="1284" y="273" width="206" height="164" rx="6" class="soft"/>
  <text x="1387" y="309" class="label center red">FROZEN VAE</text>
  <text x="1387" y="347" class="body center ink">decode</text>
  <text x="1387" y="381" class="mono center ink">latent → RGB page</text>
  <text x="1387" y="410" class="small center muted">float32 reconstruction</text>
  <path d="M1228 617 C1260 617 1244 355 1284 355" class="flow"/>

  <rect x="1284" y="548" width="206" height="164" rx="6" class="panel"/>
  <text x="1387" y="584" class="label center red">LOCAL COMPOSITE</text>
  <text x="1387" y="621" class="body center ink">soft mask α</text>
  <text x="1387" y="654" class="mono center ink">α · generated</text>
  <text x="1387" y="681" class="mono center ink">+ (1−α) · source</text>
  <text x="1387" y="707" class="small center muted">requested regions + margin</text>
  <path d="M1387 437 V548" class="flow"/>
  <path d="M340 420 C340 215 520 215 690 215 H1212 C1250 215 1250 500 1284 600" class="dash-flow"/>
  <text x="840" y="207" class="tiny muted center">source context bypass · pixels outside the soft mask</text>
  <path d="M1387 712 V789" class="flow"/>

  <rect x="1260" y="792" width="254" height="64" rx="6" fill="#c13c26"/>
  <text x="1387" y="820" class="label center" fill="#fffaf1">TRANSLATED PAGE</text>
  <text x="1387" y="844" class="small center" fill="#fffaf1">おはよう → 早上好</text>

  <!-- legend -->
  <line x1="88" y1="838" x2="125" y2="838" class="flow"/>
  <text x="136" y="844" class="tiny muted">learned / sampled path</text>
  <line x1="300" y1="838" x2="337" y2="838" class="dash"/>
  <text x="348" y="844" class="tiny muted">source context path</text>
  <text x="1525" y="875" class="tiny muted right">v3 inference configuration · tile 64 / stride 48 · training step 40,000</text>
</svg>
