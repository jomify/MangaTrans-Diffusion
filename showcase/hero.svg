<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">MangaTrans-Diffusion schematic</title>
  <desc id="desc">An original black ink page schematic showing a Japanese source balloon becoming a Chinese translation balloon through a diffusion flow.</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#171615" opacity=".18"/></pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0 0 12 5 0 10Z" fill="#c13c26"/></marker>
  </defs>
  <rect width="960" height="560" rx="22" fill="#f4ecdf"/><rect x="22" y="22" width="916" height="516" rx="16" fill="none" stroke="#171615" stroke-width="3"/>
  <path d="M44 98h872M44 452h872" stroke="#171615" stroke-width="2" opacity=".18"/>
  <text x="56" y="72" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c13c26">01 / SOURCE PAGE</text><text x="708" y="72" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c13c26">02 / RENDERED TEXT</text>
  <g transform="translate(66 142)"><rect width="290" height="250" rx="9" fill="#e4dacb" stroke="#171615" stroke-width="4"/><path d="M21 218c33-67 55-100 94-135 30 17 47 28 79 12 31 21 58 52 78 123M25 236c47-29 77-40 126-37 50-2 85 9 114 31" fill="none" stroke="#171615" stroke-width="7" stroke-linecap="round"/><path d="M34 34h222v61H34z" fill="url(#dots)" opacity=".8"/><path d="M49 118c13-21 28-31 49-34 21 3 34 12 47 34-13 19-26 29-47 32-21-3-36-13-49-32ZM166 102c17-26 38-36 64-34 17 1 33 9 48 27-13 25-33 38-60 39-25 0-41-10-52-32Z" fill="#f8f3ea" stroke="#171615" stroke-width="4"/><text x="61" y="132" font-family="serif" font-size="19" fill="#171615">原文</text><text x="187" y="126" font-family="serif" font-size="18" fill="#171615">文字</text><text x="24" y="278" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#171615" opacity=".7">PAGE + BOXES</text></g>
  <g transform="translate(381 239)"><path d="M0 36h184" stroke="#c13c26" stroke-width="5" stroke-dasharray="9 11" marker-end="url(#arrow)"/><circle cx="42" cy="36" r="12" fill="#c13c26"/><circle cx="91" cy="36" r="12" fill="#c13c26" opacity=".7"/><circle cx="140" cy="36" r="12" fill="#c13c26" opacity=".42"/><text x="17" y="-2" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#c13c26">RECTIFIED FLOW</text><text x="25" y="91" font-family="serif" font-size="20" fill="#171615">source + glyphs</text></g>
  <g transform="translate(604 142)"><rect width="290" height="250" rx="9" fill="#d9d0c3" stroke="#171615" stroke-width="4"/><path d="M21 218c33-67 55-100 94-135 30 17 47 28 79 12 31 21 58 52 78 123M25 236c47-29 77-40 126-37 50-2 85 9 114 31" fill="none" stroke="#171615" stroke-width="7" stroke-linecap="round"/><path d="M34 34h222v61H34z" fill="url(#dots)" opacity=".8"/><path d="M49 118c13-21 28-31 49-34 21 3 34 12 47 34-13 19-26 29-47 32-21-3-36-13-49-32ZM166 102c17-26 38-36 64-34 17 1 33 9 48 27-13 25-33 38-60 39-25 0-41-10-52-32Z" fill="#fffaf1" stroke="#171615" stroke-width="4"/><text x="59" y="133" font-family="serif" font-size="20" fill="#171615">别担心</text><text x="182" y="126" font-family="serif" font-size="19" fill="#171615">译文</text><text x="24" y="278" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#171615" opacity=".7">LOCAL COMPOSITE</text></g>
  <text x="56" y="494" font-family="serif" font-size="24" fill="#171615">A small renderer for a very specific visual problem.</text><text x="56" y="520" font-family="Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#171615" opacity=".65">SCHEMATIC — ORIGINAL ARTWORK, NOT A MODEL OUTPUT</text>
</svg>
